[package]
name = "crownfall"
version = "7.0.0"
edition = "2024"
rust-version = "1.88"
description = "A 3D planet arcade with illustrated chibi hosts, Fer, reactive portraits, and five CPU games"

[dependencies]
raylib = { version = "=6.0.0", default-features = false, features = ["SUPPORT_MODULE_RSHAPES", "SUPPORT_MODULE_RAUDIO", "SUPPORT_FILEFORMAT_WAV", "SUPPORT_MODULE_RTEXTURES", "SUPPORT_MODULE_RTEXT", "SUPPORT_QUADS_DRAW_MODE", "SUPPORT_IMAGE_GENERATION", "SUPPORT_IMAGE_EXPORT", "SUPPORT_FILEFORMAT_PNG", "SUPPORT_FILEFORMAT_TTF", "SUPPORT_SCREEN_CAPTURE"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2
